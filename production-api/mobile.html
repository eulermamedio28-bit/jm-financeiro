<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#26090e"><title>JM Financeiro 2.0 — Piloto local</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f9eddf;background:#18080c}*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:22px;display:grid;place-items:center;background:radial-gradient(circle at top,#54202b,#18080c 65%)}main{width:min(100%,430px);padding:25px;border:1px solid #ad824b;border-radius:22px;background:#2a1017;box-shadow:0 20px 55px #0008}.logo{border:2px solid #d3a55e;color:#eac88e;border-radius:50%;width:68px;height:68px;display:grid;place-items:center;margin:0 auto 12px;font-weight:800;font-size:24px}h1{text-align:center;font-size:24px;margin:0}p.sub{text-align:center;color:#d6bba8;font-size:13px}.notice{font-size:12px;background:#4a2630;border-left:3px solid #d3a55e;padding:12px;margin:20px 0}label{display:block;margin:15px 0 7px;font-size:14px}input,select{width:100%;padding:13px;border:1px solid #9b7445;border-radius:10px;background:#18080c;color:white;font:inherit}button{font:inherit;cursor:pointer;border-radius:11px;padding:13px}button.primary{background:#d3a55e;color:#281016;border:0;width:100%;margin-top:20px;font-weight:700}button.secondary{border:1px solid #d3a55e;background:transparent;color:#f4d3a0;width:100%;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stat{padding:13px;border-radius:12px;background:#1d0a0f;border:1px solid #79533c}.stat span{display:block;color:#d5bba6;font-size:12px}.stat strong{display:block;margin-top:6px;font-size:18px;color:#f2d29e}#dashboard{display:none}.status{min-height:18px;font-size:13px;color:#ffcabd;margin-top:13px}.muted{font-size:12px;color:#d3b9ad;text-align:center}
</style></head><body><main><div class="logo">JM</div><h1>JM Financeiro 2.0</h1><p class="sub">Acesso individual • Euler</p><div class="notice">PILOTO LOCAL: somente ambiente de testes, sem dados financeiros reais. Não utilize senhas de produção.</div><section id="login"><form id="login-form"><label for="password">Senha do ambiente de testes</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">Entrar</button></form></section><section id="dashboard"><h2>Resumo financeiro</h2><label for="establishment">Identificador do estabelecimento de teste</label><input id="establishment" placeholder="UUID do estabelecimento"><button class="primary" id="refresh">Consultar resumo</button><div class="grid"><div class="stat"><span>Receitas</span><strong id="income">—</strong></div><div class="stat"><span>Despesas</span><strong id="expense">—</strong></div><div class="stat" style="grid-column:span 2"><span>Saldo consolidado</span><strong id="balance">—</strong></div></div><h3 style="margin-top:24px;color:#f2d29e">Novo lançamento de teste</h3><form id="entry-form"><label for="entry-kind">Tipo</label><select id="entry-kind" required><option value="income">Receita</option><option value="expense">Despesa</option></select><label for="entry-account">UUID da conta</label><input id="entry-account" required><label for="entry-category">UUID da categoria</label><input id="entry-category" required><label for="entry-description">Descrição</label><input id="entry-description" maxlength="200" required><label for="entry-amount">Valor em R$</label><input id="entry-amount" type="number" min="0.01" max="1000000" step="0.01" required><button class="primary" type="submit">Registrar lançamento fictício</button></form><button class="secondary" id="logout">Sair</button></section><div class="status" id="status" role="status"></div><p class="muted">Sem armazenamento local de senhas ou tokens</p></main>
<script type="module">
import {createMobileClient} from './mobile-client.js';
const client=createMobileClient({baseUrl:location.origin});
const el=id=>document.getElementById(id);
const money=cents=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(cents)/100);
const message=text=>el('status').textContent=text;
el('login-form').addEventListener('submit',async e=>{
 e.preventDefault();message('Validando acesso...');
 try{await client.login(el('password').value);el('password').value='';el('login').style.display='none';el('dashboard').style.display='block';message('Sessão de testes iniciada.');}
 catch{message('Não foi possível entrar. Verifique as credenciais do piloto.')}
});
el('refresh').addEventListener('click',async()=>{
 try{const data=await client.summary(el('establishment').value.trim());el('income').textContent=money(data.income_cents);el('expense').textContent=money(data.expense_cents);el('balance').textContent=money(data.balance_cents);message('Resumo atualizado.');}
 catch{message('Não foi possível consultar. Verifique a sessão e o estabelecimento.')}
});
el('entry-form').addEventListener('submit',async e=>{
 e.preventDefault();
 const amount=el('entry-amount').value;
 if(!/^\\d+(\\.\\d{1,2})?$/.test(amount)){message('Valor inválido.');return;}
 const cents=Math.round(Number(amount)*100);
 if(!Number.isSafeInteger(cents)||cents<=0){message('Valor inválido.');return;}
 const input={kind:el('entry-kind').value,establishment_id:el('establishment').value.trim(),account_id:el('entry-account').value.trim(),category_id:el('entry-category').value.trim(),description:el('entry-description').value.trim(),amount_cents:cents};
 if(!confirm('Confirmar lançamento FICTÍCIO de '+money(cents)+'?'))return;
 const key='mobile_'+Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
 try{await client.record('entry',input,key);message('Lançamento fictício registrado.');el('entry-form').reset();el('refresh').click();}
 catch{message('Falha ao registrar. Confira os dados e a sessão.');}
});
el('logout').addEventListener('click',async()=>{
 try{await client.logout()}catch{}finally{el('dashboard').style.display='none';el('login').style.display='block';message('Sessão encerrada.')}
});
</script></body></html>
