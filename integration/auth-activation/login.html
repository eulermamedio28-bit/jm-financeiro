<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Teste de login — JM Financeiro</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#210b12;color:#f8ebd6;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{width:min(100%,440px);background:#35121c;border:1px solid #b7924c;border-radius:18px;padding:28px}h1{font-size:25px;color:#e5c47a}label{display:block;margin-top:18px}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{background:#210b12;color:white;border:1px solid #a78a63}button{background:#d5b36c;color:#2a0a10;border:0;font-weight:700;margin-top:20px}button:disabled{opacity:.5}p{line-height:1.5}small{color:#d9c6ad}</style></head><body><main><h1>JM Financeiro</h1><p>Teste isolado de login</p><p id="status" role="status">Carregando configuração…</p><form id="form" hidden><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button id="login" type="submit">Entrar com segurança</button></form><button id="logout" hidden>Sair</button><p><small>Ambiente de teste: não acessa nem altera seus dados financeiros.</small></p></main><script type="module" src="./login.js"></script></body></html>
