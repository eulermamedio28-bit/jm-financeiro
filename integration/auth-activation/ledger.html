<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JM Financeiro • Lançamentos</title><style>:root{color-scheme:dark}body{margin:0;background:#21090e;color:#f5e9d4;font:16px system-ui}main{max-width:560px;margin:auto;padding:24px}h1{color:#e6ba69}section{background:#321016;border:1px solid #8c663e;border-radius:16px;padding:20px;margin:18px 0}label{display:block;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #a88859;font:inherit}input,select{background:#fff;color:#211}button{background:#d7ab5c;color:#25100b;font-weight:700;margin-top:12px}button:disabled{opacity:.6}small{color:#e6ba69}#summary{padding:14px;background:#21090e;border-radius:10px;line-height:1.9}li{padding:10px 0;border-bottom:1px solid #70505a}#message{white-space:pre-wrap}</style></head><body><main><h1>JM Financeiro</h1><p>Registro autenticado de receitas e despesas — ambiente de integração.</p><section id="auth"><h2>Entrar</h2><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="ledger" hidden><button id="logout" type="button">Sair da conta</button><h2>Novo lançamento</h2><form id="entryForm"><label>Tipo<select id="tipo"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></label><label>Valor em reais<input id="valor" inputmode="decimal" placeholder="280,00" required></label><label>Descrição<input id="descricao" maxlength="500" required></label><label>Categoria<input id="categoria" maxlength="120"></label><label>Conta / forma de pagamento<input id="conta" maxlength="120" placeholder="Nubank Pix"></label><label>Data<input id="data" type="date" required></label><button id="save">Salvar no banco</button></form><h2>Resumo dos lançamentos</h2><div id="summary" aria-live="polite">Carregando…</div><h2>Últimos lançamentos</h2><button id="refresh" type="button">Atualizar</button><ul id="entries"></ul></section><p id="message" role="status"></p><small>Dados de teste. O aplicativo original permanece inalterado.</small></main><script type="module" src="./ledger.js"></script></body></html>
