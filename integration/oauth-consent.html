<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorizar JM Financeiro</title><style>body{font:16px system-ui;background:#260b10;color:#f5e5cb;max-width:450px;margin:40px auto;padding:18px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:9px}button{background:#d6b36c;color:#261010;font-weight:bold}small{color:#e9bf84}</style><h1>JM Financeiro</h1><p>Autorizar o ChatGPT a registrar e consultar lançamentos da sua conta financeira.</p><form id="f"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button id="btn">Entrar e autorizar</button></form><p id="status"></p><small>Autenticação pelo Supabase. A senha é enviada diretamente ao serviço de autenticação, não ao servidor financeiro.</small><script type="module">const s=t=>document.getElementById('status').textContent=t;const p=new URLSearchParams(location.search);document.getElementById('f').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('btn');btn.disabled=true;try{const cfg=await(await fetch('/oauth/public-config')).json();const auth=await fetch(cfg.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const session=await auth.json();document.getElementById('password').value='';if(!auth.ok||!session.access_token)throw Error('Login recusado');const response=await fetch('/oauth/consent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({supabaseToken:session.access_token,redirectUri:p.get('redirect_uri'),challenge:p.get('code_challenge'),clientId:p.get('client_id')})});const result=await response.json();if(!response.ok)throw Error(result.error||'Autorização recusada');const url=new URL(p.get('redirect_uri'));url.searchParams.set('code',result.code);if(p.has('state'))url.searchParams.set('state',p.get('state'));location.assign(url.href)}catch(err){s(err.message);btn.disabled=false}};</script></html>
