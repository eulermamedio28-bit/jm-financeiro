name: JM Financeiro Android debug APK
on:
  push:
    branches:
      - dev/jm-financeiro-integracao-segura
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > /dev/null || test "${PIPESTATUS[1]}" -eq 0
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify web interface
        run: npm run build:verify
      - name: Create Android project if missing
        run: |
          if [ ! -f android/gradlew ]; then
            if [ -d android ]; then
              echo "Projeto Android incompleto: pasta android existe sem gradlew." >&2
              exit 1
            fi
            npx cap add android
          fi
      - name: Sync Android web assets
        run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify generated APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jm-financeiro-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
