name: JM Financeiro OAuth Gateway Tests
on:
  push:
    branches: [dev/agente-financeiro-1]
    paths:
      - 'agent-gateway/**'
      - '.github/workflows/jm-oauth-gateway-tests.yml'
  workflow_dispatch:
jobs:
  oauth-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test agent-gateway/oauth.test.mjs
