name: Verify JM Financeiro online panel
on:
  push:
    branches:
      - dev/jm-financeiro-integracao-segura
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Android web assets
        run: npm run build:verify
      - name: Upload validated web assets
        uses: actions/upload-artifact@v4
        with:
          name: jm-financeiro-www-verified
          path: www/
          retention-days: 7
