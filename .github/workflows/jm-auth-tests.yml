name: JM Financeiro - testes de autenticação isolados
on:
  push:
    branches:
      - dev/jm-financeiro-integracao-segura
    paths:
      - 'integration/**'
      - '.github/workflows/jm-auth-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar portão de autenticação
        run: node --test integration/login-gate.test.mjs
