
name: Gerar APK JM Financeiro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar aplicativo
        run: |
          npm run build:verify
          npx cap add android
          npx cap sync android

      - name: Aplicar marca ELM nos icones Android
        run: |
          python3 -m pip install --user Pillow cairosvg
          python3 scripts/android-icons.py
          python3 scripts/android-system-bars.py

      - name: Verificar Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          java -version

      - name: Gerar APK
        working-directory: android
        run: bash gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JM-Financeiro-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
