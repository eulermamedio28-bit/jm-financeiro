
name: Gerar APK JM Financeiro

on:
  workflow_dispatch:
  push:
    branches:
      - dev/jm-financeiro-integracao-segura

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar aplicativo
        run: |
          npm run build:verify
          npx cap add android
          npx cap sync android

      - name: Aplicar logo JM nos icones Android
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("icons/icon-512.png").convert("RGBA")
          res = Path("android/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  icon.save(target / name)

          for folder in res.glob("mipmap-*"):
              for name in ("ic_launcher.webp", "ic_launcher_round.webp", "ic_launcher_foreground.webp"):
                  (folder / name).unlink(missing_ok=True)
          PY

      - name: Verificar Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          java -version

      - name: Gerar APK
        working-directory: android
        run: bash gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JM-Financeiro-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
