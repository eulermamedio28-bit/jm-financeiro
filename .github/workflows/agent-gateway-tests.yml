name: JM Gateway - testes de exposição mínima
on:
  push:
    branches:
      - dev/agente-financeiro-1
    paths:
      - 'agent-gateway/**'
      - '.github/workflows/agent-gateway-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: node --check server.js && node --check server.test.js
        working-directory: agent-gateway
      - name: Verificar que rotas financeiras não são expostas
        run: node --test server.test.js
        working-directory: agent-gateway
